name: Paper Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily inbox
        run: python scripts/fetch_daily_inbox.py --max-results 30
      - name: Run weekly curated set
        if: github.event.schedule == '0 2 * * 1' || github.event_name == 'workflow_dispatch'
        run: python scripts/curate_weekly_set.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox data/curated outputs/daily outputs/weekly
          git diff --cached --quiet || git commit -m "automated paper tracker update"
          git push
