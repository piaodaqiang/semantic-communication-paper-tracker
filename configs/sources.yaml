arxiv:
  enabled: true
  base_url: https://export.arxiv.org/api/query
  max_results_per_keyword: 10
  request_timeout_seconds: 20
  delay_seconds: 3
  max_retries: 2

semantic_scholar:
  enabled: false
  note: Enable in a later phase when API throttling and keys are configured.

openalex:
  enabled: true
  base_url: https://api.openalex.org/works
  max_results_per_keyword: 10
  request_timeout_seconds: 20
  delay_seconds: 2
  max_retries: 3
  mailto: ""

open_source_detection:
  papers_with_code_enabled: true
  papers_with_code_base_url: https://paperswithcode.com/api/v1/search/
  github_search_enabled: true
  github_search_url: https://api.github.com/search/repositories
  pdf_extract_enabled: true
  author_page_enabled: true
  request_timeout_seconds: 6
  max_pdf_bytes: 350000
  github_max_results: 3
  github_max_queries: 3
  github_token_env: GITHUB_TOKEN
