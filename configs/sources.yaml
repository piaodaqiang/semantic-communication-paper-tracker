arxiv:
  enabled: true
  base_url: https://export.arxiv.org/api/query
  max_results_per_keyword: 10
  request_timeout_seconds: 20
  delay_seconds: 3
  max_retries: 2

semantic_scholar:
  enabled: false
  note: Enable in a later phase when API throttling and keys are configured.

openalex:
  enabled: true
  base_url: https://api.openalex.org/works
  max_results_per_keyword: 10
  request_timeout_seconds: 20
  delay_seconds: 2
  max_retries: 3
  mailto: ""
